name: Build Terrace APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release（不勾选只编译，产物留在 Actions artifacts）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 需要写权限才能创建 Release

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: 📝 写入版本号与发布说明
        run: |
          echo "TAG=terrace-v${VERSION}" >> "$GITHUB_ENV"
          {
            echo 'CHANGES<<CHANGES_EOF'
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo 'CHANGES_EOF'
          } >> "$GITHUB_ENV"
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 构建 Debug APK
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: 📦 重命名 APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk "terrace_v${VERSION}.apk"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: terrace-apk
          path: app/build/outputs/apk/debug/terrace_v*.apk
          if-no-files-found: error

      - name: 🚀 发布到 GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Terrace v${{ env.VERSION }}
          body: |
            ${{ env.CHANGES }}

            ---
            - 版本: ${{ env.VERSION }}
            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
          files: app/build/outputs/apk/debug/terrace_v*.apk
          fail_on_unmatched_files: true
